id: 1d8c5b3a-6e72-4a09-8d3f-7b4a9c2e0f65
kind: Scheduled
name: Tier-0 - Arc server stopped sending heartbeat
description: |
  Agent tampering or outage on a Tier-0 machine. Silence is a signal.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - Heartbeat
queryFrequency: 15m
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562.001
query: |
  Heartbeat
  | where _ResourceId contains "microsoft.hybridcompute/machines"
  | where _ResourceId contains "/resourcegroups/rg-tier0-"
  | summarize LastHeartbeat = max(TimeGenerated) by Computer, ResourceId = _ResourceId
  | where LastHeartbeat < ago(15m)
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: ResourceId
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 1d
    matchingMethod: AllEntities
version: 1.1.0
